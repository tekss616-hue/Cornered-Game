name: Build Studio AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Clean project
        run: gradle clean
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release APK
        run: gradle assembleRelease
      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-ai-v0.14.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-ai-v0.14.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
