name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cornered-debug-keystore-v1

      - name: Build debug APK
        env:
          CORNERED_FIREBASE_API_KEY: ${{ secrets.CORNERED_FIREBASE_API_KEY }}
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Print APK signing fingerprints
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cornered-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
